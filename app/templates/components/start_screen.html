<div id="game-container">
<div class="landing-neo flex flex-col items-center justify-center min-h-full p-6">
    <div class="landing-neo__orb landing-neo__orb--cyan" aria-hidden="true"></div>
    <div class="landing-neo__orb landing-neo__orb--pink" aria-hidden="true"></div>
    <div class="text-center max-w-sm landing-neo__content">
        <h1 class="text-4xl font-bold mb-2 landing-neo__title">Soc Ops</h1>
        <p class="text-lg mb-8 landing-neo__subtitle">Social Bingo</p>

        <div class="landing-neo__card rounded-lg p-6 border mb-8">
            <h2 class="font-semibold mb-3 landing-neo__card-title">How to play</h2>
            <ul class="text-left text-sm space-y-2 landing-neo__rules">
                <li>• Find people who match the questions</li>
                <li>• Tap a square when you find a match</li>
                <li>• Get 5 in a row to win!</li>
            </ul>
        </div>

        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="w-full font-semibold py-4 px-8 rounded-lg text-lg transition-colors landing-neo__cta">
            Start Game
        </button>
    </div>
</div>
</div>
